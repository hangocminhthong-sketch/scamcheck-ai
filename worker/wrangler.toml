name = "scamcheck-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
MODEL = "claude-haiku-5-5"
ALLOWED_ORIGIN = "*"

# Secret (never commit):  npx wrangler secret put ANTHROPIC_API_KEY

